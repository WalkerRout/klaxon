[package]
name = "klaxon_server"
version = "0.1.0"
edition = "2024"

[dependencies]
# networking
axum = "0.8.1"
tokio = { version = "1.43.0", features = ["rt", "macros", "time", "fs"] }
tower-http = { version = "0.6.2", features = ["compression-br", "compression-gzip"] }
# logging
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
log-panics = "2.1.0"
# error handling
thiserror = "2.0.16"
# util
serde = { version = "1.0.225", features = ["derive"] }
serde_json = "1.0.149"
chrono = { version = "0.4.42", features = ["serde"] }
# kubernetes
kube = { version = "0.96", default-features = false, features = ["client", "rustls-tls"] }
k8s-openapi = { version = "0.23", features = ["latest"] }

[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = "0.1.43"
